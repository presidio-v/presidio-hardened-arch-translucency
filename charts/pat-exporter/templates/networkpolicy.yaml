{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pat-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pat-exporter.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pat-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.portName }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
