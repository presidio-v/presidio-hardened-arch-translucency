{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "pat-exporter.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.prometheusRule.namespace }}
  labels:
    {{- include "pat-exporter.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # Recording + alerting groups are the verbatim `pat rules` output. They are
  # injected with .Files.Get (not templated), so Prometheus's own annotation
  # templating (dollar-brace value expressions) passes through Helm untouched.
{{ .Files.Get "files/pat-rules.yaml" | indent 2 }}
{{- end }}
