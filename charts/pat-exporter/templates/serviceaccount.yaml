{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pat-exporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pat-exporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The exporter is read-only and never calls the Kubernetes API, so its token is
# never mounted (least privilege — arc invariant A1, "pat emits, never applies").
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
