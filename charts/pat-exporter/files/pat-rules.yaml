# Generated by `pat rules`. Review before loading.
# Reference from prometheus.yml `rule_files:`; alerts route via Alertmanager.
groups:
  - name: "pat.recording"
    rules:
      - record: "pat:predicted_rps"
        expr: "max(pat_predicted_rps)"
      - record: "pat:observed_rps"
        expr: "max(pat_observed_rps)"
      - record: "pat:demand_growth_ratio"
        expr: "max(pat_predicted_rps) / clamp_min(max(pat_observed_rps), 1)"
      - record: "pat:trend_ratio"
        expr: "max(pat_optimize_trend_ratio)"
  - name: "pat.alerts"
    rules:
      - alert: "PatDemandSurgeForecast"
        expr: "pat:demand_growth_ratio > 1.2"
        for: "10m"
        labels:
          severity: "warning"
        annotations:
          summary: "Forecast demand exceeds current observed demand"
          description: "pat forecasts demand at {{ $value | humanize }}x the current observed level (> 1.2x) for 10m -- scale-up likely needed soon."
      - alert: "PatDemandTrendRising"
        expr: "pat:trend_ratio > 0.2"
        for: "10m"
        labels:
          severity: "info"
        annotations:
          summary: "Demand trending up across the observation window"
          description: "pat demand trend is {{ $value | humanizePercentage }} (> 0.2) for 10m."
      - alert: "PatExporterAbsent"
        expr: "absent(pat_build_info)"
        for: "5m"
        labels:
          severity: "critical"
        annotations:
          summary: "pat exporter is not being scraped"
          description: "No pat_build_info series for 5m -- the pat exporter target is down or misconfigured."
