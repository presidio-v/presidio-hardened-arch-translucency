[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-arch-translucency"
version = "0.6.0"
description = "MVP implementation of architectural translucency for Docker/Kubernetes replication layer analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Vladimir Stantchev" },
]
keywords = ["architectural-translucency", "kubernetes", "docker", "performance", "replication", "presidio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "docker>=6.0.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
audit = [
    "pip-audit>=2.6.0",
]
spot = [
    "boto3>=1.26",
]

[project.scripts]
pat = "presidio_arch_translucency.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_arch_translucency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=presidio_arch_translucency --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/demo.py"]

[tool.coverage.report]
show_missing = true
