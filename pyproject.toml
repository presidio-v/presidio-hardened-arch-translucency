[build-system]
requires = ["hatchling", "tomli; python_version < '3.11'"]
build-backend = "hatchling.build"

[project]
name = "presidio-hardened-arch-translucency"
version = "0.24.1"
description = "MVP implementation of architectural translucency for Docker/Kubernetes replication layer analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Vladimir Stantchev" },
]
keywords = ["architectural-translucency", "kubernetes", "docker", "performance", "replication", "presidio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "docker>=6.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
audit = [
    "pip-audit>=2.6.0",
    # CVE guard for pip-audit/cachecontrol's transitive dependency.
    "msgpack>=1.2.1",
]
evidence = [
    # Ed25519 signing for the evidence-ref@1 SLO degradation producer
    # (evidence_producer.py). Major-bounded and lock-pinned for release auditability.
    # HMAC-SHA256 + the canonical/hash layer are stdlib.
    "cryptography>=49.0.0,<51.0.0",
]
spot = [
    "boto3>=1.26",
]
fuzz = [
    # Atheris 3.x dropped Python 3.10 (last 3.10 wheel: 2.3.0); the marker keeps
    # the extra resolvable across the >=3.10 support matrix while fuzz CI pins 3.12.
    'atheris>=3.0; python_version >= "3.11"',
]

[project.scripts]
pat = "presidio_arch_translucency.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/presidio_arch_translucency"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=presidio_arch_translucency --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/demo.py"]

[tool.coverage.report]
show_missing = true
