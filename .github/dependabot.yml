version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "security"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        patterns:
          - "ruff"
          - "pytest*"
          - "pip-audit"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # One PR for all action bumps. Ungrouped, each action opened its own PR
      # (#93-#97 had to be superseded by a single hand-batched PR #98), and every
      # one of them re-ran the full matrix for a one-line SHA change. Grouping
      # applies to version updates only; Dependabot still raises security
      # updates individually and immediately.
      github-actions:
        patterns:
          - "*"
