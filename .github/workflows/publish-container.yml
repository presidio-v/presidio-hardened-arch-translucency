name: Publish container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish (for example 0.24.1)
        required: true
        type: string

# Least privilege at the top level (OpenSSF Scorecard Token-Permissions); the
# publish job below re-declares the scoped write scopes it needs. A top-level
# `packages: write` grants that scope to every job in the workflow and is scored
# as a High-severity finding.
permissions:
  contents: read

jobs:
  publish:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read       # required for actions/checkout
      packages: write      # push the image to ghcr.io
      id-token: write      # OIDC for the build-provenance attestation
      attestations: write  # required to write the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          version="${tag#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic release tag, got ${tag}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/presidio-v/pat-exporter:${{ github.ref_name }}
            ghcr.io/presidio-v/pat-exporter:${{ steps.version.outputs.version }}
            ghcr.io/presidio-v/pat-exporter:latest

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/presidio-v/pat-exporter
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
