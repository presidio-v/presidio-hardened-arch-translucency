name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege default for GITHUB_TOKEN: jobs run untrusted PR code, so the
# token must not be able to mutate the repository. Grant more only per-job.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # show results for all versions, not just first failure
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests with coverage
        # Note: --cov and --cov-fail-under=80 come from pyproject.toml [addopts].
        # --cov-report=xml is added here for the Codecov upload step only.
        run: pytest --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lock-drift:
    name: Lock drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Verify uv.lock matches pyproject.toml
        # Fails if editing pyproject.toml would change uv.lock without the
        # lockfile being regenerated and committed. Implements the pinned-
        # versions control in sdlc/supply-chain.md.
        run: uv lock --locked

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install locked package and audit dependencies
        run: uv sync --locked --extra audit --extra evidence

      - name: Run pip-audit
        # --skip-editable skips the local (not-yet-on-PyPI) package itself.
        # The evidence extra is installed so the optional Ed25519 dependency is
        # included in the release security gate.
        # Advisory on pull requests (transitive-dep CVEs are reported but do
        # not block contributor CI; direct deps are tracked by Dependabot) —
        # BLOCKING on push (main + release tags), so a release cannot ship
        # with known-vulnerable dependencies. v0.18.0 third-party audit
        # finding: SECURITY.md describes pip-audit as a release gate, so the
        # release path must enforce it.
        run: uv run --locked pip-audit --progress-spinner=off --skip-editable
        continue-on-error: ${{ github.event_name == 'pull_request' }}

  fuzz:
    name: Fuzz (Atheris)
    # Atheris ships Linux-only wheels and none for cp310, so this job runs on
    # ubuntu-latest pinned to Python 3.12 and stays independent of the test
    # matrix above (which still covers 3.10/3.11/3.12).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install package + fuzz extra
        run: uv pip install --system -e ".[fuzz]"

      # The harness raises AssertionError explicitly (no bare asserts), so its
      # property checks fire regardless of -O/PYTHONOPTIMIZE; any unexpected
      # exception propagates and Atheris records the crash.
      - name: Run fuzz harnesses (time-boxed)
        run: |
          for f in fuzz/fuzz_*.py; do
            echo "::group::$f"
            python "$f" -atheris_runs=25000 -max_total_time=60
            echo "::endgroup::"
          done
