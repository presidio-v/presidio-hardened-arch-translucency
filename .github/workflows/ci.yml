name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege default for GITHUB_TOKEN: jobs run untrusted PR code, so the
# token must not be able to mutate the repository. Grant more only per-job.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # show results for all versions, not just first failure
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests with coverage
        # Note: --cov and --cov-fail-under=80 come from pyproject.toml [addopts].
        # --cov-report=xml is added here for the Codecov upload step only.
        run: pytest --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lock-drift:
    name: Lock drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Verify uv.lock matches pyproject.toml
        # Fails if editing pyproject.toml would change uv.lock without the
        # lockfile being regenerated and committed. Implements the pinned-
        # versions control in sdlc/supply-chain.md.
        run: uv lock --locked

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install package and pip-audit
        run: uv pip install --system -e ".[audit]"

      - name: Run pip-audit
        # --skip-editable skips the local (not-yet-on-PyPI) package itself.
        # continue-on-error: true so CVEs in transitive deps (e.g. pygments via
        # rich) are reported but do not block the CI matrix. Direct deps are
        # tracked by Dependabot PRs; pin overrides should be added to
        # pyproject.toml once a patched release is available.
        run: pip-audit --progress-spinner=off --skip-editable
        continue-on-error: true
