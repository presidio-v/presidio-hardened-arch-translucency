name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # show results for all versions, not just first failure
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff format --check .
          ruff check .

      - name: Run tests with coverage
        # Note: --cov and --cov-fail-under=80 come from pyproject.toml [addopts].
        # --cov-report=xml is added here for the Codecov upload step only.
        run: pytest --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install package and pip-audit
        run: uv pip install --system -e ".[audit]"

      - name: Run pip-audit
        # --skip-editable skips the local (not-yet-on-PyPI) package itself.
        # continue-on-error: true so CVEs in transitive deps (e.g. pygments via
        # rich) are reported but do not block the CI matrix. Direct deps are
        # tracked by Dependabot PRs; pin overrides should be added to
        # pyproject.toml once a patched release is available.
        run: pip-audit --progress-spinner=off --skip-editable
        continue-on-error: true
