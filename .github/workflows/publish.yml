name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # required for OIDC trusted publishing
  contents: read   # required for actions/checkout

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Bind to a protected environment so a manual workflow_dispatch (or release)
    # publish to PyPI requires the reviewers/rules configured on the `pypi`
    # environment in repo settings before the OIDC token is issued.
    environment: pypi

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
