name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write  # required for OIDC trusted publishing
  contents: read   # required for actions/checkout

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Bind to a protected environment so a manual workflow_dispatch (or release)
    # publish to PyPI requires the reviewers/rules configured on the `pypi`
    # environment in repo settings before the OIDC token is issued.
    environment: pypi

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
