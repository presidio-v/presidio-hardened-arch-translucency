# Grafana datasource provisioning for the pat dashboard (v0.12.0).
# Mount this directory at /etc/grafana/provisioning/datasources/.
# Edit the Prometheus URL if your service uses a different DNS name.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
