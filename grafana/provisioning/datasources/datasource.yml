# Grafana datasource provisioning for the pat dashboard (v0.12.0).
# Mount this directory at /etc/grafana/provisioning/datasources/.
# Override the Prometheus URL via the PROMETHEUS_URL env var if needed.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: ${PROMETHEUS_URL:-http://prometheus:9090}
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 30s
