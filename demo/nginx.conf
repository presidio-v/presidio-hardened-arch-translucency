# Reference nginx.conf for 4-worker variant (used by docker-compose).
# pat demo generates this dynamically based on --replicas.
events { worker_connections 1024; }
http {
    upstream workload {
        server workload:8080;  # docker-compose scales this service
    }
    server {
        listen 80;
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
        location / {
            proxy_pass         http://workload;
            proxy_connect_timeout 60s;
            proxy_read_timeout    60s;
        }
    }
}
