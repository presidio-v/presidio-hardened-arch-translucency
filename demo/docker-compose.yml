# Reference docker-compose for manual exploration.
# pat demo runs variants programmatically via the Docker SDK.
#
# Manual usage:
#   docker compose up --scale workload=4 --build
#   curl http://localhost:18090/compute?n=200000
version: "3.8"
services:
  workload:
    build: .
    # Scale: docker compose up --scale workload=4
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "18090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - workload
